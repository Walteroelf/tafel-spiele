<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tafel-Spiele – Controller</title>
<link rel="stylesheet" href="design.css?v=3">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-spiel" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="10.5" rx="5"/><path d="M7.5 10v4.5M5.25 12.25h4.5"/><circle cx="15.5" cy="11" r=".6"/><circle cx="17.8" cy="13.4" r=".6"/></symbol>
  <symbol id="i-tafel" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16.5V20"/></symbol>
  <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
  <symbol id="i-joystick" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"/><path d="M12 10.2V15M5 20.5v-2.5h14v2.5z"/></symbol>
  <symbol id="i-finger" viewBox="0 0 24 24"><path d="M3.5 12h17M7 8.5 3.5 12 7 15.5M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
  <symbol id="i-haken" viewBox="0 0 24 24"><path d="M4.5 12.5 10 18 19.5 6.5"/></symbol>
  <symbol id="i-zahnrad" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
  <symbol id="i-pfeil-links" viewBox="0 0 24 24"><path d="M19.5 12h-15M11 5.5 4.5 12l6.5 6.5"/></symbol>
  <symbol id="i-pfeil-rechts" viewBox="0 0 24 24"><path d="M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-pokal" viewBox="0 0 24 24"><path d="M7 4.5h10v5a5 5 0 0 1-10 0zM7 6.5H4v1.5a3 3 0 0 0 3 3M17 6.5h3v1.5a3 3 0 0 1-3 3M12 14.5V18M8.5 20.5h7"/></symbol>
  <symbol id="i-auge" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-stern" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
</svg>
<div class="band" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<!-- 1) Raumcode eingeben -->
<div id="join" class="screen">
  <h1><svg class="symbol"><use href="#i-spiel"/></svg> Tafel-Spiele</h1>
  <p>Gib den 4-stelligen Code von der Tafel ein – oder scanne den QR-Code mit der Kamera.</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
  <button class="big" id="goBtn">Los</button>
</div>

<!-- 2) Verbinden / Fehler -->
<div id="status" class="screen">
  <h1 id="statusTitle">Verbinde …</h1>
  <p id="statusText">Einen Moment bitte.</p>
  <button id="statusBack" style="display:none">Anderen Code eingeben</button>
</div>

<!-- 3) Aufstellen / Einstellungen -->
<div id="setup" class="screen">
  <h1>Du bist <span id="badge">–</span></h1>
  <p id="where">–</p>
  <p><b>Wie willst du lenken?</b></p>
  <div class="seg">
    <button id="mTilt"><svg class="symbol"><use href="#i-tablet"/></svg> Neigung</button>
    <button id="mJoy"><svg class="symbol"><use href="#i-joystick"/></svg> Joystick</button>
    <button id="mTouch"><svg class="symbol"><use href="#i-finger"/></svg> Schieber</button>
  </div>
  <div id="sensBox">
    <p><b>Empfindlichkeit</b> <span id="sensName"></span></p>
    <div id="sensRow"><button id="sensMinus" aria-label="weniger empfindlich">−</button><span id="sensDots"></span><button id="sensPlus" aria-label="mehr empfindlich">+</button></div>
    <div id="meter"><div id="meterKnob"></div></div>
    <span id="sensLbl"></span>
  </div>
  <p id="note"></p>
  <button class="big" id="readyBtn"><svg class="symbol"><use href="#i-haken"/></svg> Bereit</button>
  <p id="waitTxt"></p>
</div>

<!-- 4) Steuerung -->
<div id="pad" class="screen">
  <div id="banner"></div>
  <button id="gear" aria-label="Einstellungen"><svg class="symbol"><use href="#i-zahnrad"/></svg></button>
  <div id="left">
    <div id="knobTrack"></div><div id="knob"></div>
    <div id="steerHint"><svg class="symbol"><use href="#i-pfeil-links"/></svg> &nbsp; Finger links/rechts ziehen zum Lenken &nbsp; <svg class="symbol"><use href="#i-pfeil-rechts"/></svg></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="tilt">
      <div id="wheel"></div>
      <button id="calib">Geradeaus neu einstellen</button>
      <button id="enableTiltBtn" class="big" style="display:none"><svg class="symbol"><use href="#i-tablet"/></svg> Neigung aktivieren</button>
    </div>
  </div>
  <div id="right">
    <button class="pedal" id="gas">GAS</button>
    <div id="col">
      <button class="pedal" id="turbo">TURBO</button>
      <button class="pedal" id="rev" style="font-size:clamp(18px,3vw,34px)">RÜCK</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const ID_PREFIX='tafel-spiele-vb-';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- kleine Helfer für Speicher (kann in privaten Tabs fehlen) ----------
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

const params=new URLSearchParams(location.search);
let room=(params.get('room')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
let token=lsGet('scooterToken')||(Math.random().toString(36).slice(2)+Date.now().toString(36));
lsSet('scooterToken',token);

// Empfindlichkeit 1 (ruhig) bis 5 (sehr direkt), pro Steuerungsart getrennt und auf dem Gerät gemerkt
const SENS_ANGLE=[60,48,38,30,22];            // Neigung: Winkel bis zum vollen Einschlag (Grad)
const SENS_RANGE=[.40,.34,.28,.22,.16];       // Schieber: Weg bis zum vollen Einschlag (Anteil der Breite)
const SENS_JOY=[120,105,90,75,60];            // Joystick: Weg bis zum vollen Ausschlag (Pixel)
let sensLv={tilt:3,joy:3,touch:3};
try{ const o=JSON.parse(lsGet('tafelSens')||'{}'); for(const k of ['tilt','joy','touch']) if(o[k]>=1&&o[k]<=5) sensLv[k]=o[k]|0; }catch(e){}
const sens=()=>sensLv[mode]||3;
function setSens(d){
  sensLv[mode]=clamp(sens()+d,1,5); lsSet('tafelSens',JSON.stringify(sensLv)); renderSens();
}
function renderSens(){
  const v=sens();
  $('sensDots').textContent='●'.repeat(v)+'○'.repeat(5-v);
  $('sensName').textContent='('+(mode==='tilt'?'Neigung':(mode==='joy'?'Joystick':'Schieber'))+')';
  $('sensLbl').textContent=v<=2?'ruhiger: man muss weiter bewegen':(v>=4?'direkter: kleine Bewegung reicht':'normal');
  $('meter').style.display=mode==='tilt'?'':'none';
}
let mode='tilt';   // Neigung ist immer der Standard (Touch kann man pro Sitzung wählen)
let me={seat:-1,color:'#3b82f6',name:'',side:''};
let st={phase:'lobby',alive:false,inRound:false,score:0,target:3,winner:-1,winnerName:'',champion:-1,championName:'',me:-1,n:0};
let joined=false;

// ---------- Bildschirme ----------
function show(id){ for(const s of document.querySelectorAll('.screen')) s.classList.toggle('on',s.id===id); }
function setStatus(title,text,back){
  $('statusTitle').textContent=title; $('statusText').textContent=text||''; $('statusBack').style.display=back?'':'none';
  show('status');
}
const SIDE={unten:'untere',oben:'obere',links:'linke',rechts:'rechte'};

function render(){
  renderSens();
  document.documentElement.style.setProperty('--c',me.color);
  document.body.classList.toggle('tilt',mode==='tilt');
  document.body.classList.toggle('joy',mode==='joy');
  $('steerHint').innerHTML=mode==='joy'?'<svg class="symbol"><use href="#i-joystick"/></svg> Schiebe den Finger dorthin, wohin dein Auto fahren soll.<br>Oben = Richtung Tafelmitte':'<svg class="symbol"><use href="#i-pfeil-links"/></svg> &nbsp; Finger links/rechts ziehen zum Lenken &nbsp; <svg class="symbol"><use href="#i-pfeil-rechts"/></svg>';
  $('mJoy').classList.toggle('sel',mode==='joy');
  $('mTouch').classList.toggle('sel',mode==='touch');
  $('mTilt').classList.toggle('sel',mode==='tilt');
  if(!joined){ return; }
  if(st.phase==='lobby'||st.phase==='final'){
    $('badge').textContent=me.name.toUpperCase();
    $('where').textContent='Stell dich an die '+(SIDE[me.side]||'')+' Seite der Tafel – dein Auto steht dort in deiner Farbe.';
    const fin=st.phase==='final';
    const ready=mode!=='tilt'||tiltOk;
    $('readyBtn').style.display=ready?'none':'';
    $('waitTxt').textContent=(fin?(st.champ?'Du bist Champion! ':st.championName+' ist Champion! '):'')+
      (ready?'Bereit – gestartet wird an der Tafel. ':'Tippe auf „Bereit“, damit die Neigung funktioniert. ')+st.n+' Spieler verbunden.';
    show('setup');
  } else {
    show('pad');
    let b='';
    if(!st.inRound) b='Du fährst in der nächsten Runde mit …';
    else if(st.phase==='countdown') b=(st.hint||'Gleich geht es los')+' – iPad bereit halten!';
    else if(st.phase==='play') b=st.alive?'':'Du bist raus – schau zu';
    else if(st.phase==='roundEnd') b=(st.won?'Gewonnen! ':'')+(st.winnerName||'');
    $('banner').textContent=b;
    document.body.classList.toggle('nogas',!!st.noGas);
    document.body.classList.toggle('nopedals',!!st.noPedals);
    $('turbo').textContent=st.turboLabel||'TURBO';
  }
}

// ---------- Verbindung ----------
let peer=null, conn=null, retryT=null, connOpen=false, stopped=false;
function hostId(){ return ID_PREFIX+room; }

function startNet(){
  stopped=false;
  setStatus('Verbinde mit der Tafel …','Code: '+room);
  if(peer){ try{peer.destroy();}catch(e){} }
  peer=new Peer();
  peer.on('open',()=>connect());
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ setStatus('Tafel nicht gefunden','Stimmt der Code „'+room+'“? Ich versuche es weiter …',true); scheduleRetry(3000); }
    else { setStatus('Netzwerkproblem',e.type+' – ich versuche es erneut …',true); scheduleRetry(4000,true); }
  });
  peer.on('disconnected',()=>{ try{peer.reconnect();}catch(e){} });
}
function scheduleRetry(ms,fresh){
  if(stopped) return;
  clearTimeout(retryT);
  retryT=setTimeout(()=>{ if(stopped) return; if(fresh||!peer||peer.destroyed) startNet(); else connect(); },ms);
}
function connect(){
  if(stopped) return;
  clearTimeout(retryT);
  connOpen=false;
  if(conn){ try{conn.close();}catch(e){} }
  conn=peer.connect(hostId(),{serialization:'json'});
  const my=conn;
  const timeout=setTimeout(()=>{ if(my===conn&&!connOpen){ try{my.close();}catch(e){} scheduleRetry(500); } },8000);
  my.on('open',()=>{
    connOpen=true; clearTimeout(timeout);
    my.send({k:'join',token,mode});
  });
  my.on('data',onMsg);
  my.on('close',()=>{ if(my!==conn) return; connOpen=false; joined=false; setStatus('Verbindung verloren','Verbinde neu …'); scheduleRetry(1200); });
  my.on('error',()=>{ if(my!==conn) return; connOpen=false; scheduleRetry(1500); });
}
function onMsg(d){
  if(!d||typeof d!=='object') return;
  if(d.k==='seat'){
    me={seat:d.seat,color:d.color,name:d.name,side:d.side}; joined=true; render();
  } else if(d.k==='full'){
    stopped=true; setStatus('Die Tafel ist voll','Es sind schon alle Plätze belegt.',true);
  } else if(d.k==='st'){
    const prev=st.phase; st=d;
    if(d.phase==='countdown'&&prev!=='countdown') calibrate();
    if(d.phase==='play'&&prev!=='play'&&navigator.vibrate) try{navigator.vibrate(80);}catch(e){}
    render();
  }
}
function sendMsg(o){ try{ if(conn&&connOpen) conn.send(o); }catch(e){} }

// ---------- Eingabe: Touch ----------
let steerTouch=0, gasOn=false, revOn=false, turboOn=false, turboCool=0;
const knob=$('knob');

let joyVec=[0,0];
(function setupSteer(){
  const z=$('left'), jb=$('joyBase'), jk=$('joyKnob'); let id=null, ox=0, oy=0;
  const R=()=>SENS_JOY[sens()-1];
  z.addEventListener('pointerdown',e=>{
    if((mode!=='touch'&&mode!=='joy')||id!==null) return;
    id=e.pointerId; ox=e.clientX; oy=e.clientY; try{z.setPointerCapture(id);}catch(err){}
    steerTouch=0; joyVec=[0,0];
    if(mode==='joy'){
      const r=z.getBoundingClientRect();
      jb.style.left=(ox-r.left-100)+'px'; jb.style.top=(oy-r.top-100)+'px'; jb.style.display='block';
      jk.style.transform='';
    }
  });
  z.addEventListener('pointermove',e=>{
    if(e.pointerId!==id) return;
    if(mode==='joy'){
      let dx=e.clientX-ox, dy=e.clientY-oy; const len=Math.hypot(dx,dy);
      const RR=R(); if(len>RR){ dx*=RR/len; dy*=RR/len; }
      joyVec=[dx/RR,dy/RR];
      jk.style.transform='translate('+dx+'px,'+dy+'px)';
      return;
    }
    const range=Math.max(60,z.clientWidth*SENS_RANGE[sens()-1]);
    steerTouch=clamp((e.clientX-ox)/range,-1,1);
    knob.style.transform='translateX('+(steerTouch*z.clientWidth*.32)+'px)';
  });
  const end=e=>{ if(e.pointerId!==id) return; id=null; steerTouch=0; joyVec=[0,0]; knob.style.transform=''; jb.style.display='none'; };
  z.addEventListener('pointerup',end); z.addEventListener('pointercancel',end);
})();

function hold(el,setter){
  const on=e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(err){} setter(true); el.classList.add('down'); };
  const off=()=>{ setter(false); el.classList.remove('down'); };
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
}
hold($('gas'),v=>gasOn=v);
hold($('rev'),v=>revOn=v);
hold($('turbo'),v=>{ turboOn=v; if(v&&turboCool<=0&&!st.turboHold){ turboCool=3; $('turbo').classList.add('cool'); } });
setInterval(()=>{ if(turboCool>0){ turboCool-=.1; if(turboCool<=0) $('turbo').classList.remove('cool'); } },100);

// ---------- Eingabe: Neigung ----------
let wheel=null, wheelRef=0, tiltSmooth=0, tiltOk=false;
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  // Richtung „oben" (Schwerkraft) in der Bildschirmebene -> Drehwinkel wie bei einem Lenkrad
  const ux=-Math.cos(b)*Math.sin(g), uy=Math.sin(b);
  if(Math.hypot(ux,uy)<.3) return;   // iPad liegt flach: Winkel unzuverlässig
  const w=Math.atan2(-ux,uy);
  if(wheel===null) wheelRef=w;
  wheel=w;
}
function wheelDelta(){
  if(wheel===null) return 0;
  let d=wheel-wheelRef;
  while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
  return d*180/Math.PI;
}
function calibrate(){ if(wheel!==null) wheelRef=wheel; }
function tiltSteer(){
  const deg=wheelDelta(), dz=4, full=SENS_ANGLE[sens()-1];
  const v=clamp((Math.abs(deg)-dz)/(full-dz),0,1)*Math.sign(deg);
  tiltSmooth+=(v-tiltSmooth)*.5;
  $('wheel').style.transform='rotate('+clamp(deg,-90,90)+'deg)';
  return tiltSmooth;
}
$('calib').addEventListener('click',calibrate);

async function enableTilt(){
  try{
    if(typeof DeviceOrientationEvent==='undefined') throw new Error('kein Sensor');
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ $('note').textContent='Zugriff abgelehnt. Safari: Einstellungen → Safari → „Bewegung & Ausrichtung" erlauben.'; return false; }
    }
    if(!tiltOk){ addEventListener('deviceorientation',onOrient); tiltOk=true; }
    setTimeout(()=>{ if(wheel===null && mode==='tilt') $('note').textContent='Keine Sensordaten – bitte Touch wählen oder iPad aufrecht halten.'; },1500);
    return true;
  }catch(e){
    $('note').textContent='Neigung geht auf diesem Gerät nicht – bitte Touch nutzen.';
    return false;
  }
}

// ---------- Moduswahl ----------
async function setMode(m){
  $('note').textContent='';
  if(m==='tilt'){
    const ok=await enableTilt();
    if(!ok){ m='touch'; }
    else $('note').textContent='Halte das iPad aufrecht wie ein Lenkrad und drehe es. Tipp: Drehsperre im Kontrollzentrum einschalten.';
  }
  mode=m; steerTouch=0; joyVec=[0,0]; renderSens();
  if(m==='joy') $('note').textContent='Schiebe den Finger dorthin, wohin das Auto fahren soll. Oben zeigt immer zur Tafelmitte. Gas ist automatisch.';
  sendMsg({k:'mode',mode:m});
  render();
  showEnableBtn();
}
$('mTouch').addEventListener('click',()=>setMode('touch'));
$('mJoy').addEventListener('click',()=>setMode('joy'));
$('sensMinus').addEventListener('click',()=>setSens(-1));
$('sensPlus').addEventListener('click',()=>setSens(1));
$('mTilt').addEventListener('click',()=>setMode('tilt'));
$('readyBtn').addEventListener('click',()=>setMode(mode));
$('enableTiltBtn').addEventListener('click',()=>setMode('tilt'));
$('gear').addEventListener('click',()=>{ show('setup'); });
// Aus den Einstellungen zurück ins Spiel, wenn gerade gespielt wird
$('setup').addEventListener('click',e=>{ if(e.target.id==='setup'&&st.phase!=='lobby'&&st.phase!=='final') render(); });

// ---------- Senden (30x pro Sekunde) ----------
setInterval(()=>{
  if(mode==='tilt'&&$('setup').classList.contains('on')){ const v=tiltSteer(); $('meterKnob').style.left=(50+v*46)+'%'; }
  if(!connOpen||!joined) return;
  if(st.phase==='lobby'||st.phase==='final') return;
  if(mode==='joy'){ sendMsg({k:'in',j:[Math.round(joyVec[0]*100)/100,Math.round(joyVec[1]*100)/100],s:0,g:0,t:turboOn?1:0}); return; }
  const s=mode==='tilt'?tiltSteer():steerTouch;
  sendMsg({k:'in',s:Math.round(s*100)/100,g:gasOn?1:(revOn?-1:0),t:turboOn?1:0});
},33);

// ---------- Aufwachen halten, Scrollen/Zoomen sperren ----------
document.addEventListener('touchmove',e=>{ if(!(e.target instanceof HTMLInputElement)) e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) keepAwake(); });
document.addEventListener('pointerdown',keepAwake,{once:true});

// ---------- Start ----------
$('goBtn').addEventListener('click',()=>{
  const c=$('code').value.toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4){ $('code').focus(); return; }
  room=c; startNet();
});
$('statusBack').addEventListener('click',()=>{ stopped=true; clearTimeout(retryT); show('join'); });
$('code').addEventListener('keydown',e=>{ if(e.key==='Enter') $('goBtn').click(); });

// Neigung ist Standard. Auf dem iPad braucht die Erlaubnis einen Tipp („Bereit"-Knopf oder Knopf im Spiel).
function showEnableBtn(){
  const need=mode==='tilt'&&!tiltOk;
  $('enableTiltBtn').style.display=need?'':'none';
  $('calib').style.display=need?'none':'';
}
if(mode==='tilt'){
  if(typeof DeviceOrientationEvent==='undefined') mode='touch';
  else if(typeof DeviceOrientationEvent.requestPermission!=='function') enableTilt();
}
showEnableBtn();
render();
if(room.length===4) startNet(); else show('join');
</script>
</body>
</html>
