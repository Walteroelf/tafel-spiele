<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tafel-Spiele</title>
<style>
  :root{--bg:#0d1220;--card:#1a2238;--txt:#f2f5ff;--mute:#9aa7c4}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
  h1{margin:0;font-size:clamp(32px,7vw,64px)}
  p{margin:0;color:var(--mute);font-size:clamp(16px,2.5vw,22px);max-width:620px}
  .row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  a{display:block;padding:26px 34px;border-radius:24px;background:var(--card);color:var(--txt);text-decoration:none;
    font-size:clamp(20px,3.5vw,32px);font-weight:800;border:3px solid #34406a;min-width:min(78vw,300px)}
  a small{display:block;font-weight:500;font-size:.55em;color:var(--mute);margin-top:6px}
  a:hover{border-color:#3b82f6}
</style>
</head>
<body>
<main>
  <h1>🎮 Tafel-Spiele</h1>
  <p>Spiele für die liegende Tafel, gesteuert mit den iPads: Scooter, Fußball, Hockey, Lichtspur und Münzjagd.</p>
  <div class="row">
    <a href="board.html">🖥️ Tafel starten<small>auf der großen Tafel öffnen</small></a>
    <a href="play.html">📱 Mitspielen<small>auf dem iPad öffnen (oder QR-Code scannen)</small></a>
  </div>
</main>
</body>
</html>
