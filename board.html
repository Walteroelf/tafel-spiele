<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autoscooter-Arena – Tafel</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
'use strict';
/* ============================================================
   Autoscooter-Arena – Tafel-Seite
   Die Tafel zeigt nur das Spiel. Gesteuert wird per iPad (play.html).
   ============================================================ */

// ---------- Einstellungen (hier kann man drehen) ----------
const MAX_PLAYERS = 8;          // mehr Plätze: SEATS + COLORS erweitern
const W = 1600, H = 900;        // logische Spielfläche (16:9), wird auf die Tafel skaliert
const CX = W/2, CY = H/2, R0 = 390;   // Arena-Mitte und Radius
const CAR_R = 22;
const ID_PREFIX = 'scooter-arena-vb-';

const COLORS = [
  ['Rot','#ef4444'],['Blau','#3b82f6'],['Gelb','#facc15'],['Grün','#22c55e'],
  ['Orange','#f97316'],['Lila','#a855f7'],['Pink','#ec4899'],['Türkis','#14b8a6']
];
// Plätze rund um die Tafel. rot = Drehung des Anzeigefelds, damit es zum Spieler hin lesbar ist.
const SEATS = [
  {side:'unten', x:.50,y:1,  rot:0},
  {side:'oben',  x:.50,y:0,  rot:Math.PI},
  {side:'links', x:0,  y:.50,rot:Math.PI/2},
  {side:'rechts',x:1,  y:.50,rot:-Math.PI/2},
  {side:'unten', x:.82,y:1,  rot:0},
  {side:'oben',  x:.18,y:0,  rot:Math.PI},
  {side:'links', x:0,  y:.22,rot:Math.PI/2},
  {side:'rechts',x:1,  y:.82,rot:-Math.PI/2},
];

// ---------- Hilfsfunktionen ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ---------- Canvas ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let scale=1,offX=0,offY=0;
function resize(){
  const d=devicePixelRatio||1;
  cv.width=Math.round(innerWidth*d); cv.height=Math.round(innerHeight*d);
  scale=Math.min(cv.width/W,cv.height/H);
  offX=(cv.width-W*scale)/2; offY=(cv.height-H*scale)/2;
}
addEventListener('resize',resize); resize();

// ---------- Ton ----------
let ac=null;
function audioInit(){
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){}
}
function beep(f,d=.12,type='square',vol=.07,slide=0){
  if(!ac) return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
let bumpCd=0;

// ---------- Spielzustand ----------
const players=new Array(MAX_PLAYERS).fill(null);
let phase='lobby', phaseT=0, arenaT=0, roundNo=0, target=3;
let winnerSeat=-1, championSeat=-1, curR=R0, homeConfirm=0, lastCount=0;
let particles=[], shake=0, buttons=[];
const ZERO={s:0,g:0,t:0};

const present=()=>players.filter(Boolean);
const inRound=()=>players.filter(p=>p&&p.car);
const cname=s=>COLORS[s][0];

function seatAngle(seat){
  const s=SEATS[seat];
  return Math.atan2(s.y*H-CY, s.x*W-CX);
}
function spawnCar(seat){
  const a=seatAngle(seat), r=R0*.68;
  return {x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r, vx:0,vy:0, a:a+Math.PI,
          falling:false, fall:0, fallT:0, dead:false, deadT:0, turboCd:0, turboFx:0};
}

function addPlayer(extra){
  const i=players.findIndex(p=>!p);
  if(i<0) return null;
  const p=Object.assign({seat:i,color:COLORS[i][1],score:0,input:{s:0,g:0,t:0},lastIn:0,
    conn:null,mode:'touch',car:null,discAt:0,lastMsg:''},extra||{});
  players[i]=p;
  if(phase==='lobby') p.car=spawnCar(i);
  return p;
}
function addBot(){ const p=addPlayer({bot:true,mode:'bot'}); if(p) beep(520,.08); }
function removeBot(){
  for(let i=MAX_PLAYERS-1;i>=0;i--) if(players[i]&&players[i].bot){players[i]=null;return;}
}

// ---------- Netzwerk (PeerJS, direkte Verbindung iPad -> Tafel) ----------
let peer=null, room='', peerReady=false, netStatus='Verbinde …', qrCanvas=null, joinUrl='';
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ';
function genCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}

function makeQR(url){
  try{
    const qr=qrcode(0,'M'); qr.addData(url); qr.make();
    const n=qr.getModuleCount(), cell=8, q=3, size=(n+q*2)*cell;
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,size,size); g.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++) if(qr.isDark(r,k)) g.fillRect((k+q)*cell,(r+q)*cell,cell,cell);
    return c;
  }catch(e){ console.error(e); return null; }
}

function startPeer(){
  if(peer){ try{peer.destroy();}catch(e){} }
  peerReady=false; netStatus='Verbinde mit Vermittlungsserver …';
  room=genCode();
  peer=new Peer(ID_PREFIX+room);
  peer.on('open',()=>{
    peerReady=true; netStatus='';
    joinUrl=new URL('play.html?room='+room, location.href).href;
    qrCanvas=makeQR(joinUrl);
  });
  peer.on('connection',conn=>{
    conn.on('data',d=>onMsg(conn,d));
    conn.on('close',()=>onClose(conn));
    conn.on('error',()=>onClose(conn));
  });
  peer.on('disconnected',()=>{ try{peer.reconnect();}catch(e){} });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){ startPeer(); return; }
    netStatus='Netzwerkfehler: '+e.type;
    if(e.type==='network'||e.type==='server-error'||e.type==='socket-error') setTimeout(startPeer,4000);
  });
}

function send(conn,obj){ try{ if(conn&&conn.open) conn.send(obj); }catch(e){} }

function playerOf(conn){ return players.find(p=>p&&p.conn===conn)||null; }

function onMsg(conn,d){
  if(!d||typeof d!=='object') return;
  if(d.k==='join'){
    let p=players.find(q=>q&&!q.bot&&q.token&&q.token===d.token);
    if(p){ if(p.conn&&p.conn!==conn){ try{p.conn.close();}catch(e){} } }
    else {
      p=addPlayer({token:d.token});
      if(!p){ send(conn,{k:'full'}); return; }
    }
    p.conn=conn; p.discAt=0; p.lastIn=0; p.lastMsg='';
    if(d.mode) p.mode=d.mode;
    send(conn,{k:'seat',seat:p.seat,color:p.color,name:cname(p.seat),side:SEATS[p.seat].side});
    beep(700,.08,'triangle'); beep(900,.1,'triangle');
  } else if(d.k==='in'){
    const p=playerOf(conn); if(!p) return;
    p.input={s:clamp(+d.s||0,-1,1),g:clamp(+d.g||0,-1,1),t:d.t?1:0};
    p.lastIn=performance.now();
  } else if(d.k==='mode'){
    const p=playerOf(conn); if(p&&(d.mode==='touch'||d.mode==='tilt')) p.mode=d.mode;
  }
  // Start und Neustart gibt es nur an der Tafel (keine Start-Nachricht von iPads).
}
function onClose(conn){
  const p=playerOf(conn);
  if(p){ p.conn=null; p.discAt=performance.now(); p.input={s:0,g:0,t:0}; }
}

let pushT=0;
function pushState(dt){
  pushT-=dt; if(pushT>0) return; pushT=.2;
  for(const p of players){
    if(!p||!p.conn) continue;
    const c=p.car;
    const msg={k:'st',phase,alive:!!c&&!c.falling&&!c.dead,inRound:!!c&&phase!=='lobby',
      score:p.score,target,winner:winnerSeat,winnerName:winnerSeat>=0?cname(winnerSeat):'',
      champion:championSeat,championName:championSeat>=0?cname(championSeat):'',me:p.seat,n:present().length};
    const s=JSON.stringify(msg);
    if(s!==p.lastMsg){ p.lastMsg=s; send(p.conn,msg); }
  }
}

// ---------- Spielablauf ----------
function startMatch(){
  for(const p of present()) p.score=0;
  roundNo=0; championSeat=-1; winnerSeat=-1;
  startRound();
}
function startRound(){
  roundNo++; arenaT=0; curR=R0; winnerSeat=-1; particles=[]; lastCount=0;
  for(const p of present()) p.car=spawnCar(p.seat);
  phase='countdown'; phaseT=3.4;
}
function toLobby(){
  phase='lobby'; winnerSeat=-1; championSeat=-1; particles=[];
  for(const p of present()){ p.score=0; p.car=spawnCar(p.seat); }
}
function endRound(w){
  phase='roundEnd'; phaseT=3.4;
  winnerSeat=w?w.seat:-1;
  if(w){ w.score++; confetti(CX,CY,50,w.color); beep(660,.15,'triangle'); setTimeout(()=>beep(880,.2,'triangle'),160); }
}
function confetti(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), v=rand(120,520);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-200,life:rand(1.2,2.4),g:500,
      c:Math.random()<.5?color:COLORS[Math.floor(rand(0,COLORS.length))][1],s:rand(6,12),rot:rand(0,6)});
  }
}
function sparks(x,y,n){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), v=rand(80,320);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.5),g:0,c:'#ffd24a',s:4,rot:0,spark:true});
  }
}

// ---------- Bots ----------
function botInput(p){
  const c=p.car;
  if(!c||c.dead||c.falling) return ZERO;
  const dc=Math.hypot(c.x-CX,c.y-CY);
  let tgt=null,best=1e9;
  for(const q of inRound()){
    if(q===p||q.car.dead||q.car.falling) continue;
    const d=Math.hypot(q.car.x-c.x,q.car.y-c.y);
    if(d<best){best=d;tgt=q.car;}
  }
  let tx=CX,ty=CY;
  if(tgt&&dc<curR*.7){ tx=tgt.x+tgt.vx*.25; ty=tgt.y+tgt.vy*.25; }
  const want=Math.atan2(ty-c.y,tx-c.x), diff=angDiff(want,c.a);
  const s=clamp(diff*2.2,-1,1);
  const g=Math.abs(diff)<1.7?1:.15;
  const t=(tgt&&best<260&&Math.abs(diff)<.12&&dc<curR*.6&&Math.random()<.03)?1:0;
  return {s,g,t};
}
function inputOf(p){
  if(p.bot) return botInput(p);
  if(!p.conn||performance.now()-p.lastIn>1000) return ZERO;
  return p.input;
}

// ---------- Physik ----------
function drive(c,inp,dt){
  const fx=Math.cos(c.a), fy=Math.sin(c.a), sx=-fy, sy=fx;
  let vf=c.vx*fx+c.vy*fy, vs=c.vx*sx+c.vy*sy;
  const turnFac=clamp(Math.abs(vf)/110,.3,1)*(vf<-10?-1:1);
  c.a+=inp.s*3.1*turnFac*dt;
  vf+=inp.g*(inp.g>0?430:300)*dt;
  vf-=vf*1.4*dt;
  vs-=vs*5*dt;
  c.turboCd-=dt; c.turboFx-=dt;
  if(inp.t&&c.turboCd<=0){ vf=Math.max(vf,0)+430; c.turboCd=3; c.turboFx=.4; beep(300,.18,'sawtooth',.06,500); }
  const nfx=Math.cos(c.a), nfy=Math.sin(c.a);
  c.vx=nfx*vf-nfy*vs; c.vy=nfy*vf+nfx*vs;
  c.x+=c.vx*dt; c.y+=c.vy*dt;
}
function startFall(c){
  c.falling=true; c.fall=0; c.fallT=performance.now()/1000;
  beep(520,.6,'sine',.09,-440);
}
function physics(dt){
  const list=inRound();
  for(const p of list){
    const c=p.car;
    if(c.dead){ c.deadT+=dt; continue; }
    if(c.falling){
      c.fall+=dt/.9; c.x+=c.vx*dt; c.y+=c.vy*dt; c.a+=dt*5;
      if(c.fall>=1){c.dead=true;c.fall=1;}
      continue;
    }
    if(phase==='countdown') continue;
    drive(c,inputOf(p),dt);
  }
  if(phase==='countdown') return;
  // Stöße
  const act=list.filter(p=>!p.car.dead&&!p.car.falling);
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i].car,b=act[j].car;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>=CAR_R*2||d===0) continue;
    const nx=dx/d,ny=dy/d, ov=CAR_R*2-d;
    a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(vn<0){
      const j2=-(1+1.0)*vn/2;
      a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;
      if(-vn>90){
        sparks((a.x+b.x)/2,(a.y+b.y)/2,Math.min(14,Math.floor(-vn/30)));
        shake=Math.max(shake,Math.min(10,-vn/40));
        if(bumpCd<=0){beep(130,.12,'sawtooth',.1,-60);bumpCd=.08;}
      }
    }
  }
  // Rand der Arena
  for(const p of act){
    const c=p.car;
    if(Math.hypot(c.x-CX,c.y-CY)>curR+4) startFall(c);
  }
}

function update(dt){
  bumpCd-=dt;
  if(homeConfirm>0) homeConfirm-=dt;
  // Aufräumen: getrennte iPads in der Lobby nach 12 s entfernen
  const now=performance.now();
  for(let i=0;i<MAX_PLAYERS;i++){
    const p=players[i];
    if(p&&!p.bot&&!p.conn&&p.discAt&&now-p.discAt>12000&&(phase==='lobby'||phase==='final')) players[i]=null;
  }
  if(phase==='lobby'){
    for(const p of present()) if(!p.car) p.car=spawnCar(p.seat);
  } else if(phase==='countdown'){
    phaseT-=dt;
    const n=Math.ceil(phaseT-.4);
    if(n!==lastCount){ lastCount=n; if(n>0&&n<=3) beep(520,.15,'square'); }
    if(phaseT<=.4 ){ phase='play'; beep(1000,.4,'square',.08); }
    physics(dt);
  } else if(phase==='play'){
    arenaT+=dt;
    curR=R0*(1-.45*clamp((arenaT-15)/45,0,1));
    physics(dt);
    const list=inRound();
    const alive=list.filter(p=>!p.car.falling&&!p.car.dead);
    if(list.length>=2&&alive.length<=1){
      let w=alive[0];
      if(!w) w=list.slice().sort((a,b)=>b.car.fallT-a.car.fallT)[0];
      endRound(w);
    } else if(list.length===1&&list[0].car.dead&&list[0].car.deadT>1.2){
      list[0].car=spawnCar(list[0].seat); // Übungsmodus: allein fahren
    }
  } else if(phase==='roundEnd'){
    phaseT-=dt; physics(dt);
    if(phaseT<=0){
      const top=present().filter(p=>p.score>=target).sort((a,b)=>b.score-a.score)[0];
      if(top){ phase='final'; championSeat=top.seat; confetti(CX,CY,160,top.color); beep(523,.2,'triangle'); setTimeout(()=>beep(659,.2,'triangle'),200); setTimeout(()=>beep(784,.35,'triangle'),400); }
      else startRound();
    }
  } else if(phase==='final'){
    if(Math.random()<dt*3) confetti(rand(200,1400),-10,6,COLORS[championSeat>=0?championSeat:0][1]);
  }
  for(const q of particles){ q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.rot+=dt*6; }
  particles=particles.filter(q=>q.life>0);
  shake=Math.max(0,shake-dt*30);
  pushState(dt);
}

// ---------- Zeichnen ----------
function button(x,y,w,h,label,fn,opts){
  opts=opts||{};
  buttons.push({x,y,w,h,fn});
  ctx.save();
  rrect(ctx,x-w/2,y-h/2,w,h,h/4);
  ctx.fillStyle=opts.fill||'#1f6feb'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold '+(opts.font||Math.round(h*.42))+'px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,x,y+2);
  ctx.restore();
}
function text(t,x,y,size,color,weight,align){
  ctx.font=(weight||'bold')+' '+size+'px system-ui,sans-serif';
  ctx.fillStyle=color||'#fff'; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillText(t,x,y);
}

function drawArena(){
  // Hintergrund (Leere)
  const bg=ctx.createRadialGradient(CX,CY,100,CX,CY,900);
  bg.addColorStop(0,'#14192b'); bg.addColorStop(1,'#05070d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // ursprünglicher Rand (schwach), falls die Arena schrumpft
  if(curR<R0-1){
    ctx.save(); ctx.setLineDash([10,14]); ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(CX,CY,R0,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  // Glow
  ctx.save();
  ctx.shadowColor='rgba(255,70,50,.55)'; ctx.shadowBlur=38;
  ctx.beginPath(); ctx.arc(CX,CY,curR,0,Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();
  // Boden
  const g=ctx.createRadialGradient(CX,CY-60,40,CX,CY,curR);
  g.addColorStop(0,'#4a5470'); g.addColorStop(1,'#272e42');
  ctx.beginPath(); ctx.arc(CX,CY,curR,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  // Deko-Ringe
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=2;
  for(const f of [.66,.33]){ ctx.beginPath(); ctx.arc(CX,CY,curR*f,0,Math.PI*2); ctx.stroke(); }
  // Warnrand
  ctx.lineWidth=14; ctx.strokeStyle='#f5c518'; ctx.beginPath(); ctx.arc(CX,CY,curR+2,0,Math.PI*2); ctx.stroke();
  ctx.save(); ctx.setLineDash([22,22]); ctx.strokeStyle='#15171f';
  ctx.beginPath(); ctx.arc(CX,CY,curR+2,0,Math.PI*2); ctx.stroke(); ctx.restore();
}

function drawCar(p){
  const c=p.car; if(!c||c.dead) return;
  const sc=c.falling?Math.max(0,1-c.fall):1;
  ctx.save();
  ctx.translate(c.x,c.y); ctx.rotate(c.a); ctx.scale(sc,sc);
  // Schatten
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(3,5,26,22,0,0,Math.PI*2); ctx.fill();
  // Turbo-Flamme
  if(c.turboFx>0){
    ctx.fillStyle='#ff9a1f'; ctx.beginPath(); ctx.moveTo(-22,-9); ctx.lineTo(-22-40*(c.turboFx/.4+.3),0); ctx.lineTo(-22,9); ctx.fill();
    ctx.fillStyle='#fff2a8'; ctx.beginPath(); ctx.moveTo(-22,-4); ctx.lineTo(-22-22*(c.turboFx/.4+.3),0); ctx.lineTo(-22,4); ctx.fill();
  }
  // Gummiring
  ctx.beginPath(); ctx.arc(0,0,CAR_R,0,Math.PI*2); ctx.fillStyle='#20232c'; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='#0c0d12'; ctx.stroke();
  // Karosserie
  rrect(ctx,-17,-14,34,28,9); ctx.fillStyle=p.color; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.stroke();
  // Scheibe
  rrect(ctx,2,-9,10,18,4); ctx.fillStyle='rgba(20,30,50,.85)'; ctx.fill();
  // Scheinwerfer
  ctx.fillStyle='#fff7c2'; ctx.fillRect(15,-11,3,5); ctx.fillRect(15,6,3,5);
  ctx.restore();
}

function drawBadge(seat,p){
  const s=SEATS[seat];
  const sx=s.x*W, sy=s.y*H;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(s.rot);
  const x=-115,y=-70,w=230,h=60;
  if(!p){
    if(phase==='lobby'){
      ctx.globalAlpha=.45; ctx.setLineDash([8,8]); ctx.lineWidth=2; ctx.strokeStyle=COLORS[seat][1];
      rrect(ctx,x,y,w,h,14); ctx.stroke();
      ctx.setLineDash([]); text('frei',0,y+h/2,22,COLORS[seat][1],'600');
    }
    ctx.restore(); return;
  }
  const out=p.car&&(p.car.dead||p.car.falling)&&phase!=='lobby';
  ctx.globalAlpha=out?.5:1;
  rrect(ctx,x,y,w,h,14); ctx.fillStyle=p.color; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=(winnerSeat===seat||championSeat===seat)?'#fff':'rgba(0,0,0,.35)'; ctx.stroke();
  const icon=p.bot?'🤖':(p.conn?(p.mode==='tilt'?'📱':'👆'):'⚠');
  text(icon+' '+cname(seat).toUpperCase(),x+14,y+h/2+1,28,'#10131a','800','left');
  // Siegpunkte
  const n=target, step=24, startX=x+w-16-(n-1)*step;
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(startX+i*step,y+h/2,9,0,Math.PI*2);
    ctx.fillStyle=i<p.score?'#fff':'rgba(0,0,0,.25)'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.stroke();
  }
  ctx.restore();
}

function drawLobby(){
  text('AUTOSCOOTER-ARENA',CX,118,36,'#fff','800');
  if(peerReady&&qrCanvas){
    const qs=230;
    ctx.imageSmoothingEnabled=false;
    rrect(ctx,CX-qs/2-8,350-qs/2-8,qs+16,qs+16,12); ctx.fillStyle='#fff'; ctx.fill();
    ctx.drawImage(qrCanvas,CX-qs/2,350-qs/2,qs,qs);
    text('Code: '+room,CX,495,40,'#ffd24a','800');
  } else {
    text(netStatus||'…',CX,350,26,'#9aa7c4','600');
  }
  button(CX,570,280,70,present().length?'▶  START':'▶  START (ohne Spieler)',()=>startMatch(),{fill:'#1a9b4b',font:30});
  const nb=present().filter(p=>p.bot).length;
  button(CX-100,655,170,50,'+ Bot',()=>addBot(),{fill:'#3b4261',font:24});
  button(CX+100,655,170,50,'− Bot',()=>removeBot(),{fill:'#3b4261',font:24});
  button(CX,725,380,52,'Siege bis: '+target+' Runden',()=>{target=target>=5?1:target+2;},{fill:'#3b4261',font:24});
  text(present().length+' / '+MAX_PLAYERS+' Spieler'+(nb?' (davon '+nb+' Bot)':''),CX,775,20,'#c9d3ee','600');
}

function drawOverlay(){
  if(phase==='countdown'){
    const n=Math.ceil(phaseT-.4);
    if(n>0){
      text(String(n),CX,CY,240,'#fff','900');
    }
    text('Runde '+roundNo,CX,CY-200,36,'#fff','800');
  } else if(phase==='play'){
    if(arenaT<1.2 ){ text('LOS!',CX,CY,200,'#ffd24a','900'); }
    else if(arenaT>14&&arenaT<18){ text('⚠ Die Arena schrumpft!',CX,CY-250,34,'#ffd24a','800'); }
  } else if(phase==='roundEnd'){
    ctx.save();
    rrect(ctx,CX-300,CY-70,600,140,24); ctx.fillStyle='rgba(8,10,18,.8)'; ctx.fill();
    ctx.restore();
    if(winnerSeat>=0){
      text('🏆 '+cname(winnerSeat).toUpperCase()+' gewinnt die Runde!',CX,CY,40,COLORS[winnerSeat][1],'900');
    } else text('Unentschieden',CX,CY,44,'#fff','900');
  } else if(phase==='final'){
    ctx.save();
    rrect(ctx,CX-330,CY-200,660,400,28); ctx.fillStyle='rgba(8,10,18,.88)'; ctx.fill();
    ctx.lineWidth=5; ctx.strokeStyle=COLORS[championSeat>=0?championSeat:0][1]; ctx.stroke();
    ctx.restore();
    text('🏆 CHAMPION 🏆',CX,CY-140,46,'#fff','900');
    if(championSeat>=0) text(cname(championSeat).toUpperCase(),CX,CY-60,84,COLORS[championSeat][1],'900');
    button(CX-150,CY+70,260,70,'Nochmal',()=>startMatch(),{fill:'#1a9b4b',font:30});
    button(CX+150,CY+70,260,70,'Lobby',()=>toLobby(),{fill:'#3b4261',font:30});
    text('Neue Mitspieler können jederzeit per QR-Code beitreten',CX,CY+150,20,'#9aa7c4','600');
  }
  // Zurück zur Lobby (zweimal tippen)
  if(phase==='countdown'||phase==='play'||phase==='roundEnd'){
    button(52,52,56,56,homeConfirm>0?'?':'⌂',()=>{ if(homeConfirm>0){homeConfirm=0;toLobby();} else homeConfirm=2.5; },
      {fill:homeConfirm>0?'#b42318':'rgba(255,255,255,.12)',font:30});
  }
}

function draw(){
  buttons=[];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,offX,offY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  if(shake>0) ctx.translate(rand(-shake,shake),rand(-shake,shake));
  drawArena();
  for(const p of present()) drawCar(p);
  for(const q of particles){
    ctx.globalAlpha=clamp(q.life*2,0,1); ctx.fillStyle=q.c;
    if(q.spark) ctx.fillRect(q.x-2,q.y-2,4,4);
    else { ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot); ctx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2); ctx.restore(); }
  }
  ctx.globalAlpha=1;
  ctx.restore();
  for(let i=0;i<MAX_PLAYERS;i++) drawBadge(i,players[i]);
  if(phase==='lobby') drawLobby();
  drawOverlay();
}

// ---------- Eingabe an der Tafel (nur Tippen, eine Berührung genügt) ----------
cv.addEventListener('pointerdown',e=>{
  audioInit();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(err){}
  const d=devicePixelRatio||1;
  const x=(e.clientX*d-offX)/scale, y=(e.clientY*d-offY)/scale;
  for(const b of buttons){
    if(Math.abs(x-b.x)<=b.w/2&&Math.abs(y-b.y)<=b.h/2){ b.fn(); break; }
  }
});
addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(phase==='lobby'||phase==='final')){audioInit();startMatch();}
  if(e.key==='b') addBot();
});

// ---------- Start ----------
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
startPeer();
requestAnimationFrame(frame);
window.__game={players,SEATS,addBot,startMatch,get phase(){return phase;}}; // zum Testen
</script>
</body>
</html>
